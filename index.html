<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>Hedera E2EE Chat</title>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      /* react-native-web sizes the app with flex: 1, so the root must be a flex
         container; otherwise the chat grows past the window and the composer
         scrolls away instead of staying docked. */
      #root { display: flex; flex-direction: column; }
      body { background: #07090c; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      /* Dark, thin scrollbars to match the app on desktop browsers. */
      :root { color-scheme: dark; }
      * { scrollbar-width: thin; scrollbar-color: #2a303c transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/web/main.tsx"></script>
  </body>
</html>
