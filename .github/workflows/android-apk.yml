# Installable Android test build on every push to main.
#
# build:   release APK (JS bundled in, no dev server needed), signed with the
#          private test key from Actions secrets (TEST_KEYSTORE_BASE64 and the
#          three TEST_* password/alias secrets) so each build installs over
#          the previous one.
# smoke:   installs it on an emulator, opens it, and fails if the app closes;
#          the crash lines (or the first screen's text) become annotations.
# publish: only after smoke passes, as the "android-latest" pre-release:
#   https://github.com/1ksn1ks/hedera-e2ee-chat-app/releases/download/android-latest/hedera-e2ee-chat.apk
# Store builds are not made here: they use the private upload key.
name: Android test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

env:
  APP_VERSION_CODE: ${{ github.run_number }}
  APP_VERSION_NAME: 0.1.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # Node 24 / npm 11, the same as the dev machine: the lockfile leaves out
      # nested WalletConnect copies of async-storage, which npm 11 accepts and
      # npm 10 (Node 22) rejects in npm ci.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: npm ci

      - name: Type check and unit tests
        run: |
          npm run typecheck
          npm test

      # 4 GB heap: GitHub runners have 16 GB, and the 2 GB in gradle.properties
      # is tight for a release build (R8/lint/Hermes) of a React Native app.
      # x86_64 is only for the emulator smoke test; phones use the arm builds.
      - name: Build the release APK (test-signed)
        working-directory: android
        env:
          TEST_KEYSTORE_BASE64: ${{ secrets.TEST_KEYSTORE_BASE64 }}
          TEST_STORE_PASSWORD: ${{ secrets.TEST_STORE_PASSWORD }}
          TEST_KEY_ALIAS: ${{ secrets.TEST_KEY_ALIAS }}
          TEST_KEY_PASSWORD: ${{ secrets.TEST_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$TEST_KEYSTORE_BASE64" ] || missing="$missing TEST_KEYSTORE_BASE64"
          [ -n "$TEST_STORE_PASSWORD" ] || missing="$missing TEST_STORE_PASSWORD"
          [ -n "$TEST_KEY_ALIAS" ] || missing="$missing TEST_KEY_ALIAS"
          [ -n "$TEST_KEY_PASSWORD" ] || missing="$missing TEST_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error title=Test signing secrets missing::Add these GitHub Actions secrets before this workflow can sign the test APK:$missing"
            exit 1
          fi
          umask 077
          trap 'rm -f "$RUNNER_TEMP/test-keystore.p12"' EXIT
          # A pasted secret often ends with a carriage return. GNU base64 rejects that.
          printf '%s' "$TEST_KEYSTORE_BASE64" | tr -d '\r\n \t' | base64 -d > "$RUNNER_TEMP/test-keystore.p12" || {
            echo "::error title=Test keystore did not decode::TEST_KEYSTORE_BASE64 is not valid base64. Paste only the long line under that name."
            exit 1
          }
          [ -s "$RUNNER_TEMP/test-keystore.p12" ] || { echo "::error title=Test keystore empty::TEST_KEYSTORE_BASE64 did not decode to a keystore."; exit 1; }
          export TEST_KEYSTORE="$RUNNER_TEMP/test-keystore.p12"
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64 \
            "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" \
            --no-daemon --stacktrace 2>&1 | tee gradle.log

      # Job logs need a signed-in admin; annotations are public. Put Gradle's
      # own explanation of a failure into one so it can be read anywhere.
      - name: Show why Gradle failed
        if: failure()
        working-directory: android
        run: |
          [ -f gradle.log ] || exit 0
          {
            awk '/What went wrong:/{f=1} f{print} /\* Try:/{f=0}' gradle.log | head -40
            grep -E "^e: |error:|FAILED|CMake Error|ninja: build stopped|Execution failed|OutOfMemory|Java heap" gradle.log | head -30
          } > why.txt
          msg=$(sed 's/%/%25/g; s/\r//g' why.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Gradle build failed::${msg}"

      - name: Name and verify the APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk hedera-e2ee-chat.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "${BUILD_TOOLS}apksigner" verify --print-certs hedera-e2ee-chat.apk
          "${BUILD_TOOLS}aapt2" dump badging hedera-e2ee-chat.apk | head -1

      - uses: actions/upload-artifact@v4
        with:
          name: hedera-e2ee-chat-apk
          path: hedera-e2ee-chat.apk
          retention-days: 14

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: hedera-e2ee-chat-apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open the app on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/android-smoke.sh hedera-e2ee-chat.apk com.hederae2eechat "Hedera E2EE Chat"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: |
            logcat.txt
            ui.xml
            screen.png
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hedera-e2ee-chat-apk

      - name: Publish as the android-latest test build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest hedera-e2ee-chat.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Android test build ${APP_VERSION_NAME}" \
            --notes "Test build ${APP_VERSION_NAME} from ${GITHUB_SHA::7}. Opened on an Android emulator before publishing. On the phone: download hedera-e2ee-chat.apk, open it, allow installing from this source. Each build installs over the previous one. The first build after the signing-key change does not: uninstall the old test app once, then unlock the topic again. Not a store build."
